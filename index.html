<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mina Valle Hermoso</title></head><body><h2>Mina Valle Hermoso</h2><p>Cargando la aplicación...</p><script>(async()=>{try{const r=await fetch("./app.gz.b64");if(!r.ok)throw Error();const b=Uint8Array.from(atob((await r.text()).trim()),c=>c.charCodeAt(0));const s=new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"));document.open();document.write(await new Response(s).text());document.close()}catch(e){document.body.innerHTML="<p>No se pudo cargar la app. Actualiza la página.</p>"}})();</script></body></html>
